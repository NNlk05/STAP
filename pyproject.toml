[project]
name = "stap"
version = "0.1.0"
description = "STAP: STAck Processing"
readme = "README.md"
authors = [
    { name = "NNlk05", email = "helloworldfromnowheresvill@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "llvmlite>=0.50.0",
]

[project.scripts]
stap = "stap:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
